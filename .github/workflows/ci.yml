name: CI

# Every push and pull request: formatting and lint, the full test suite, coverage and the docs build
# (make ci), with every extra installed from the frozen lock. mypy (make type-check) still reports errors
# in code kept as the book prints it, so it runs separately, not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  ci:
    name: Format, tests, coverage and docs (macOS, Python 3.13)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install the pinned dependencies, every extra
        run: uv sync --frozen --all-extras
      - name: make ci
        run: make ci
