[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-retail-foundations"
version = "0.1.0"
description = "Companion code for Foundations of Agentic AI for Retail, Third Edition."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
  { name = "Fatih Nayebi", email = "f.nayebi@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# List your core runtime dependencies here
dependencies = [
    "marimo>=0.25.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "jsonschema>=4.26.0",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.1",
    "openai>=3.29.0",
    "openai-agents>=0.23.1",
    "tiktoken>=0.14.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.5",
    "ipywidgets>=8.1.9",
    "ipykernel>=7.4.0",
    "nest_asyncio>=1.6.0",
    "pydantic>=2.14.1",
    "typing-extensions>=4.16.0",
    "typing_inspect>=0.9.0",
    "aiohttp>=3.14.5",
    "tenacity>=9.1.4", # Google GenAI requires Tenacity <9.2.
    "sentence-transformers>=6.1.0",
    "unstructured>=0.27.25",
    "pdfminer.six>=20260107",
    "pymupdf>=1.28.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "fastapi>=0.141.1", # Google ADK caps OpenTelemetry below FastAPI 0.142+'s requirement.
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "sse-starlette>=3.5.0",
    "pydantic-settings>=2.15.0",
    "langserve>=0.3.3",
    "langsmith>=0.14.8",
    "altair>=6.3.0",
    "vega-datasets>=0.9.0",
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
    "opencv-python-headless>=5.0.0.93",
    "rdflib>=7.6.0",
    "SPARQLWrapper>=2.0.0",
    "dowhy>=0.14",
    "econml>=0.17.0",
    "doubleml>=0.11.4",
    "networkx>=3.7",
    "python-dotenv>=1.2.4",
    "starlette>=1.8.0",
]

[project.optional-dependencies]
streaming = ["redis>=8.1.0", "kafka-python>=3.0.11"]
spark = ["pyspark>=4.2.0"]
gnn = ["torch-geometric>=2.8.1"]
monitoring = ["prometheus-client>=0.26.0"]
cloud = ["psycopg2-binary>=2.9.13", "supabase>=2.32.0"]
auth = ["python-jose>=3.5.0", "bcrypt>=5.0.0"]
explainability = ["shap>=0.53.0"]

# Development dependencies: linters, formatters, testing, docs
dev = [
    "ruff>=0.17.0", # Linter, formatter, and more
    "mypy>=2.4.0", # Static type checker
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0", # For coverage with pytest
    "pytest-asyncio>=1.4.0",
    "coverage[toml]>=7.16.2",
    "pre-commit>=4.7.0",
    "uv>=0.13.0",
    # Type stubs
    "types-requests>=2.33.0.20261006",
    "pandas-stubs>=3.0.5.260914",
    "types-networkx>=3.6.1.20261006",
    "types-python-jose>=3.5.0.20260408",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "mkdocs-git-revision-date-localized-plugin>=1.6.0",
]

agent_protocols = [
    "google-adk>=2.12.0",
    "a2a-sdk>=1.2.2",
    "protobuf>=7.36.2",
    # AP2 v0.2.0 pins older Pydantic and pytest; use the compatible official release.
    "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@v0.1.0",
]

[project.urls]
Homepage = "https://github.com/gradient-divergence/agentic-retail-foundations"
Repository = "https://github.com/gradient-divergence/agentic-retail-foundations"

# --- Tool Configurations ---

# Add setuptools configuration to specify packages
[tool.setuptools.packages.find]
# Define where to look for packages ('.' means the root directory)
where = ["."]
# Explicitly list the directories that are Python packages
include = ["agents*", "capstone*", "connectors*", "models*", "utils*", "config*", "environments*", "demos*", "notebooks*"]
# Exclude directories that are definitely not packages
exclude = ["tests*", "docs*", "qmd*"]

[tool.ruff]
# See https://docs.astral.sh/ruff/configuration/
target-version = "py310" # Keep printed examples in the existing syntax subset.
line-length = 110
# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "notebooks",
]

[tool.ruff.lint.per-file-ignores]
"agents/bdi.py" = ["C901"]
"notebooks/ethical-considerations-and-governance.py" = ["E501"]
"notebooks/multi-agent-systems-in-retail.py" = ["E501"]
"notebooks/sensor-networks-and-cognitive-systems.py" = ["E501"]
"notebooks/real-world-case-studies.py" = ["E501"]
"demos/*.py" = ["T201"]

[tool.ruff.lint]
# Select rule codes to enable. Add more as needed (e.g., "I" for isort)
# Start with defaults and gradually add more. `ruff check --select ALL .` shows available.
select = ["E", "F", "W", "C90", "UP", "I", "B", "T20"] # Added I (isort), B (bugbear), T20 (print)
ignore = [] # Rule codes to ignore (e.g., "E501" if you don't enforce line length strictly)

[tool.ruff.format]
# See https://docs.astral.sh/ruff/formatter/
# Kept exactly as printed in the book, where a call is wrapped to the page width.
exclude = ["demos/ooda_pricing_decide_excerpt.py"]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# See https://mypy.readthedocs.io/en/stable/config_file.html
python_version = "3.13" # Match the supported dependency stack
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true # Ensure all functions are annotated
# Removed global ignore_missing_imports (false is default)

# Global excludes
exclude = [
    "build/",
    ".venv/",
    "demos/",
    "notebooks/", # Keep excluding notebooks for now
    "tests/",
]

# Use per-module ignores for libraries known to lack stubs
[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "statsmodels.*",
    "sklearn.*",
    "dowhy.*",
    "econml.*",
    "doubleml.*",
    "supabase.*",
    "psycopg2.*",
    "SPARQLWrapper.*",
    "redis.*",
    "kafka.*",
    "graphviz.*",
    "pyspark.*",
    "shap.*",
    # Add other problematic libraries here
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "notebooks.ethical_considerations_and_governance"
disable_error_code = ["name-defined", "no-redef"]

[tool.pytest.ini_options]
# See https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
minversion = "6.0"
addopts = "-ra -q" # Coverage is opt-in through make coverage.
markers = ["asyncio: coroutine test run with an event loop"]
testpaths = [
    "tests", # Directory where tests are located
]
pythonpath = "." # Add project root to PYTHONPATH for imports

[tool.coverage.run]
# See https://coverage.readthedocs.io/en/latest/config.html
branch = true # Measure branch coverage
source = ["agents", "connectors", "utils", "environments"]
# Keep coverage focused on library code that readers will import/reuse.
# Demo scripts and large experimental modules are exercised via integration demos, not unit coverage.
omit = [
    "demos/*",
    "notebooks/*",
    "agents/promotion_causal.py",
    "agents/inventory.py",
    "agents/inventory_orchestration.py",
    "agents/messaging.py",
    "agents/replenishment.py",
    "agents/coordinators/*",
    "agents/protocols/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# NOTE: Keep this realistic for an educational codebase with many optional modules.
# Raise gradually as Tier A examples gain deeper test coverage.
fail_under = 70 # Optional: Fail if coverage is below this percentage
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
